<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventario de Aseo{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            min-height: 100vh;
        }
        
        .glass-strong {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .bg-gradient-primary {
            background: linear-gradient(135deg, #26c6da 0%, #00acc1 100%);
        }
    </style>
</head>
<body class="antialiased">
    
    <!-- Navbar Simplificado de Aseo -->
    <nav class="bg-gradient-primary shadow-lg mb-6">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center">
                        <i class="fas fa-broom text-cyan-600 text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-white text-2xl font-bold">Inventario de Aseo</h1>
                        <p class="text-cyan-100 text-sm">Sistema simplificado</p>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="flex items-center space-x-4">
                    <a href="{% url 'select_inventory' %}" class="px-4 py-2 bg-white text-cyan-700 rounded-lg hover:bg-cyan-50 transition font-semibold">
                        <i class="fas fa-exchange-alt mr-2"></i>
                        Cambiar a General
                    </a>
                    <a href="{% url 'logout' %}" class="px-4 py-2 bg-white bg-opacity-20 text-white rounded-lg hover:bg-opacity-30 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                        Salir
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mx-auto px-6 pb-12">
        {% block content %}{% endblock %}
    </div>

    <!-- JavaScript -->
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 px-6 py-4 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            } text-white font-semibold`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'} mr-3"></i>
                    <span>${message}</span>
                </div>
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
