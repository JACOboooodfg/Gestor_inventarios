{% extends 'base.html' %}

{% block title %}{{ title }} - Inventario Escolar{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card-bg rounded-xl shadow-sm border card-border p-8">
        <h1 class="text-2xl font-bold text-main mb-6">{{ title }}</h1>
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">Nombre *</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">Descripción</label>
                {{ form.description }}
            </div>
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">Ícono</label>
                    {{ form.icon }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">Color</label>
                    {{ form.color }}
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-5 border-t divider">
                <a href="{% url 'category_list' %}"
                   class="font-semibold py-2.5 px-6 rounded-xl transition text-sm"
                   style="background: rgba(128,128,128,0.15); color: #9ca3af;">
                    Cancelar
                </a>
                <button type="submit"
                        class="text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm hover:opacity-90"
                        style="background: #73956F;">
                    <i class="fas fa-save mr-2"></i>Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
