{% extends 'base.html' %}

{% block title %}Registro - Gestor Escolar{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <div class="inline-block bg-white bg-opacity-20 p-6 rounded-full mb-4">
                <i class="fas fa-user-plus text-white text-5xl"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-2">
                Crear Cuenta
            </h2>
            <p class="text-white text-opacity-80">
                Gestor Escolar
            </p>
        </div>
        
        <!-- Card de Registro -->
        <div class="glass-strong rounded-2xl shadow-2xl p-8">
            <form method="post" action="{% url 'register' %}" class="space-y-5">
                {% csrf_token %}
                
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-user mr-2" style="color: #424C55;"></i>Usuario
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="Nombre de usuario"
                    >
                </div>
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-envelope mr-2" style="color: #424C55;"></i>Email
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="correo@ejemplo.com"
                    >
                </div>
                
                <!-- First Name -->
                <div>
                    <label for="first_name" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-id-card mr-2" style="color: #424C55;"></i>Nombre
                    </label>
                    <input 
                        type="text" 
                        name="first_name" 
                        id="first_name"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="Tu nombre"
                    >
                </div>
                
                <!-- Last Name -->
                <div>
                    <label for="last_name" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-id-card mr-2" style="color: #424C55;"></i>Apellido
                    </label>
                    <input 
                        type="text" 
                        name="last_name" 
                        id="last_name"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="Tu apellido"
                    >
                </div>
                
                <!-- Password 1 -->
                <div>
                    <label for="password1" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-lock mr-2" style="color: #424C55;"></i>Contraseña
                    </label>
                    <input 
                        type="password" 
                        name="password1" 
                        id="password1"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="Mínimo 6 caracteres"
                    >
                </div>
                
                <!-- Password 2 -->
                <div>
                    <label for="password2" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-lock mr-2" style="color: #424C55;"></i>Confirmar Contraseña
                    </label>
                    <input 
                        type="password" 
                        name="password2" 
                        id="password2"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                        placeholder="Repite tu contraseña"
                    >
                </div>
                
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full btn-modern gradient-primary text-white font-bold py-4 px-6 rounded-xl shadow-lg"
                >
                    <i class="fas fa-user-plus mr-2"></i>
                    Crear Cuenta
                </button>
            </form>
            
            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    ¿Ya tienes una cuenta? 
                    <a href="{% url 'login' %}" class="font-medium hover:underline transition-colors" style="color: #424C55;">
                        Inicia sesión aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
