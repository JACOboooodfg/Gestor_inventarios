{% extends 'base.html' %}
{% block title %}Crear Cuenta - Inventario Escolar{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4" style="background: linear-gradient(135deg, #36453B 0%, #515751 60%, #596869 100%);">
    <div class="bg-[#F5F9E9] rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

        <!-- Header -->
        <div class="bg-[#36453B] px-8 py-6 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#515751] mb-3">
                <i class="fas fa-user-plus text-3xl text-[#C2C1A5]"></i>
            </div>
            <h1 class="text-xl font-bold text-[#F5F9E9]">Crear Cuenta</h1>
            <p class="text-[#C2C1A5] text-xs mt-1">Únete al Sistema de Inventario</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-[#36453B] mb-1">Nombre</label>
                        <input type="text" name="first_name"
                               class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                               placeholder="Juan">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#36453B] mb-1">Apellido</label>
                        <input type="text" name="last_name"
                               class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                               placeholder="Pérez">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#36453B] mb-1">
                        <i class="fas fa-at mr-1 text-[#596869]"></i>Usuario *
                    </label>
                    <input type="text" name="username" required
                           class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                           placeholder="usuario123">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#36453B] mb-1">
                        <i class="fas fa-envelope mr-1 text-[#596869]"></i>Email *
                    </label>
                    <input type="email" name="email" required
                           class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                           placeholder="tu@email.com">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#36453B] mb-1">
                        <i class="fas fa-lock mr-1 text-[#596869]"></i>Contraseña *
                    </label>
                    <input type="password" name="password1" required
                           class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                           placeholder="Mínimo 6 caracteres">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#36453B] mb-1">
                        <i class="fas fa-lock mr-1 text-[#596869]"></i>Confirmar Contraseña *
                    </label>
                    <input type="password" name="password2" required
                           class="w-full px-3 py-2 rounded-lg border-2 border-[#C2C1A5] bg-white text-[#515751] focus:border-[#36453B] focus:outline-none text-sm transition"
                           placeholder="Repite la contraseña">
                </div>

                <button type="submit"
                        class="w-full bg-[#36453B] hover:bg-[#515751] text-[#F5F9E9] font-bold py-3 rounded-lg transition shadow-md mt-2">
                    <i class="fas fa-user-plus mr-2"></i>Crear Cuenta
                </button>
            </form>

            <p class="text-center text-sm text-[#596869] mt-5">
                ¿Ya tienes cuenta?
                <a href="{% url 'login' %}" class="font-bold text-[#36453B] hover:underline">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
