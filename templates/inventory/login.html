{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Sistema de Inventarios{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <div class="inline-block bg-white bg-opacity-20 p-6 rounded-full mb-4">
                <i class="fas fa-boxes text-white text-5xl"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-2">
                Bienvenido
            </h2>
            <p class="text-white text-opacity-80">
                Sistema de Gestión de Inventarios
            </p>
        </div>
        
        <!-- Card de Login -->
        <div class="glass-strong rounded-2xl shadow-2xl p-8">
            <form method="post" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                
                <!-- Username -->
                <div>
                    <label for="id_username" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-user mr-2" style="color: #886F68;"></i>Usuario
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            name="username" 
                            id="id_username"
                            required
                            class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 focus:border-opacity-50 transition-all"
                            style="focus:ring-color: #886F68; focus:border-color: #886F68;"
                            placeholder="Ingresa tu usuario"
                        >
                        <i class="fas fa-user absolute left-4 top-4 text-gray-400"></i>
                    </div>
                </div>
                
                <!-- Password -->
                <div>
                    <label for="id_password" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-lock mr-2" style="color: #886F68;"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            name="password" 
                            id="id_password"
                            required
                            class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                            placeholder="Ingresa tu contraseña"
                        >
                        <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>
                    </div>
                </div>
                
                <!-- Remember Me -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember_me" 
                            name="remember_me" 
                            type="checkbox" 
                            class="h-4 w-4 border-gray-300 rounded"
                            style="color: #886F68;"
                        >
                        <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                            Recordarme
                        </label>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full btn-modern gradient-primary text-white font-bold py-4 px-6 rounded-xl shadow-lg"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    ¿No tienes una cuenta? 
                    <a href="{% url 'register' %}" class="font-medium hover:underline transition-colors" style="color: #886F68;">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </div>
        
        <!-- Features -->
        <div class="mt-8 grid grid-cols-3 gap-4">
            <div class="text-center">
                <div class="glass rounded-xl p-4">
                    <i class="fas fa-shield-alt text-white text-2xl mb-2"></i>
                    <p class="text-white text-xs">Seguro</p>
                </div>
            </div>
            <div class="text-center">
                <div class="glass rounded-xl p-4">
                    <i class="fas fa-bolt text-white text-2xl mb-2"></i>
                    <p class="text-white text-xs">Rápido</p>
                </div>
            </div>
            <div class="text-center">
                <div class="glass rounded-xl p-4">
                    <i class="fas fa-cloud text-white text-2xl mb-2"></i>
                    <p class="text-white text-xs">En la Nube</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Animación de partículas en el fondo */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(circle at 20% 50%, rgba(209, 204, 220, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(136, 111, 104, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 40% 20%, rgba(245, 237, 240, 0.1) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }
    
    /* Input focus effects */
    input:focus {
        transform: translateY(-2px);
        border-color: #886F68 !important;
        ring-color: #886F68 !important;
    }
</style>
{% endblock %}
