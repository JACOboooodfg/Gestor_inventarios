{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Gestor Escolar{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <div class="inline-block bg-white bg-opacity-20 p-6 rounded-full mb-4">
                <i class="fas fa-boxes text-white text-5xl"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-2">
                Bienvenido
            </h2>
            <p class="text-white text-opacity-80">
                Gestor Escolar
            </p>
        </div>
        
        <!-- Card de Login -->
        <div class="glass-strong rounded-2xl shadow-2xl p-8">
            <form method="post" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                
                <!-- Username -->
                <div>
                    <label for="id_username" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-user mr-2" style="color: #424C55;"></i>Usuario
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            name="username" 
                            id="id_username"
                            required
                            class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 focus:border-opacity-50 transition-all"
                            placeholder="Ingresa tu usuario"
                        >
                        <i class="fas fa-user absolute left-4 top-4 text-gray-400"></i>
                    </div>
                </div>
                
                <!-- Password -->
                <div>
                    <label for="id_password" class="block text-sm font-medium mb-2" style="color: #3D2C2E;">
                        <i class="fas fa-lock mr-2" style="color: #424C55;"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            name="password" 
                            id="id_password"
                            required
                            class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-xl focus:ring-4 focus:ring-opacity-20 transition-all"
                            placeholder="Ingresa tu contraseña"
                        >
                        <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>
                    </div>
                </div>
                
                <!-- Remember Me -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember_me" 
                            name="remember_me" 
                            type="checkbox" 
                            class="h-4 w-4 border-gray-300 rounded"
                        >
                        <label for="remember_me" class="ml-2 block text-sm text-gray-700">
                            Recordarme
                        </label>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full btn-modern gradient-primary text-white font-bold py-4 px-6 rounded-xl shadow-lg"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Google Login -->
            {% if google_login_enabled %}
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">O continúa con</span>
                    </div>
                </div>

                <div class="mt-6">
                    <a href="{% url 'social:begin' 'google-oauth2' %}" 
                       class="w-full flex justify-center items-center px-4 py-3 border border-gray-300 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-all">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Iniciar sesión con Google
                    </a>
                </div>
            </div>
            {% endif %}
            
            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    ¿No tienes una cuenta? 
                    <a href="{% url 'register' %}" class="font-medium hover:underline transition-colors" style="color: #424C55;">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </div>
        

    </div>
</div>
{% endblock %}
