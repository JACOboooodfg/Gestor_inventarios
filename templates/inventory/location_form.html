{% extends 'base.html' %}

{% block title %}{{ title }} - Inventario Escolar{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ title }}</h1>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Nombre *</label>
                {{ form.name }}
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Edificio</label>
                    {{ form.building }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Piso</label>
                    {{ form.floor }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Salón/Aula</label>
                    {{ form.room }}
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Descripción</label>
                {{ form.description }}
            </div>
            
            <div class="flex justify-end space-x-3 pt-6 border-t">
                <a href="{% url 'location_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg transition">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                    <i class="fas fa-save mr-2"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
