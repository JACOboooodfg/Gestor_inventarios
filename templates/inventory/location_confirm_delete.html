{% extends 'base.html' %}

{% block title %}Eliminar Ubicación - Inventario Escolar{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-6">
            <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">¿Eliminar Ubicación?</h1>
        </div>

        <div class="bg-gray-50 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800">{{ location }}</h2>
            {% if location.description %}
            <p class="text-gray-600 mt-2">{{ location.description }}</p>
            {% endif %}
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-3">
                <a href="{% url 'location_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg transition">
                    <i class="fas fa-times mr-2"></i>Cancelar
                </a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                    <i class="fas fa-trash mr-2"></i>Sí, Eliminar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
